<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BASIS G3 Master Audio Flashcards</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* 护眼暖白/米灰高雅背景 */
      background-color: #f7f8fa;
      color: #2c3e50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 36px 24px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid #e1e4e8;
      margin-bottom: 20px;
    }
    .tag {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }
    /* 莫兰迪低饱和度护眼配色 */
    .tag-math { background-color: #e3f2fd; color: #1565c0; }
    .tag-english { background-color: #fff3e0; color: #e65100; }
    .tag-thinking { background-color: #f3e5f5; color: #7b1fa2; }
    
    /* 极致超大字号术语标题 */
    .term {
      font-size: 3.1rem;
      font-weight: 900;
      color: #1a202c;
      margin-bottom: 16px;
      word-break: break-word;
      line-height: 1.15;
    }
    .definition {
      font-size: 1.35rem;
      color: #4a5568;
      line-height: 1.6;
      margin-bottom: 20px;
      min-height: 4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    /* 词性练习下划线高亮样式 */
    .definition u {
      text-decoration: underline;
      text-decoration-thickness: 3px;
      text-underline-offset: 5px;
      color: #6b46c1;
      font-weight: 800;
      padding: 0 4px;
    }
    .example {
      font-size: 1.05rem;
      font-style: italic;
      color: #276749;
      background: #f0fff4;
      padding: 14px;
      border-radius: 14px;
      border-left: 4px solid #38a169;
      margin-bottom: 10px;
      text-align: left;
    }
    .btn {
      background-color: #6b46c1;
      color: #fff;
      border: none;
      padding: 18px 32px;
      font-size: 1.25rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(107, 70, 193, 0.3);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background-color: #edf2f7;
      color: #2d3748;
      box-shadow: none;
      border: 1px solid #cbd5e0;
    }
    .btn-manual {
      background-color: #319795;
      color: #fff;
      box-shadow: 0 4px 14px rgba(49, 151, 149, 0.3);
    }
    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 520px;
    }
    .status-text {
      margin-top: 16px;
      font-size: 1rem;
      color: #718096;
      font-weight: 600;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div id="category-tag" class="tag tag-english">English Term</div>
    <div id="term-text" class="term">Loading...</div>
    <div id="definition-text" class="definition">准备就绪</div>
    <div id="example-text" class="example hidden"></div>
  </div>

  <div style="width:100%; max-width:520px;">
    <button id="show-answer-btn" class="btn btn-manual" onclick="showAnswer()">💡 显示答案 (秒出结果)</button>
    <button id="main-btn" class="btn" onclick="toggleAudioFlow()">▶ 开启/停止 语音自动复习 (8秒思考)</button>
    <div class="controls" style="margin-top: 12px;">
      <button class="btn btn-secondary" onclick="prevCard()">上一题</button>
      <button class="btn btn-secondary" onclick="nextCard()">下一题</button>
    </div>
  </div>

  <div id="status" class="status-text">就绪：点击“开启语音自动复习”或点击“上一题/下一题”翻页。</div>

  <script>
    // 最新定制 BASIS G3 车上复习词库与题库
    const flashcards = [
      // 1. 英语词性基础概念 (Parts of Speech Definitions)
      {
        category: "English",
        term: "Noun",
        question: "What is a noun?",
        answer: "A noun is a word that names a person, place, thing, or idea.",
        example: "Teacher, school, pencil, and happiness are nouns."
      },
      {
        category: "English",
        term: "Verb",
        question: "What is a verb?",
        answer: "A verb is a word that shows an action or a state of being.",
        example: "Run, jump, think, and is are verbs."
      },
      {
        category: "English",
        term: "Adjective",
        question: "What is an adjective?",
        answer: "An adjective is a word that describes or modifies a noun or pronoun.",
        example: "The fluffy, white dog barked loudly."
      },
      {
        category: "English",
        term: "Adverb",
        question: "What is an adverb?",
        answer: "An adverb is a word that describes a verb, an adjective, or another adverb, often ending in '-ly'.",
        example: "She ran quickly to catch the bus."
      },
      {
        category: "English",
        term: "Pronoun",
        question: "What is a pronoun?",
        answer: "A pronoun is a word that takes the place of one or more nouns.",
        example: "He, she, it, they, and we are pronouns."
      },

      // 2. G3 级别词性实战练习题 (下划线辨析: Noun, Verb, Adjective, Adverb, Pronoun)
      {
        category: "English",
        term: "Part of Speech #1",
        question: "Identify the part of speech of the underlined word: The <u>brave</u> knight protected the castle.",
        speechQuestion: "Identify the part of speech of the word 'brave' in the sentence: The brave knight protected the castle.",
        answer: "Adjective. 'Brave' describes the noun 'knight'.",
        example: "What kind of knight? A brave knight."
      },
      {
        category: "English",
        term: "Part of Speech #2",
        question: "Identify the part of speech of the underlined word: The cheetah sprinted <u>swiftly</u> across the grass.",
        speechQuestion: "Identify the part of speech of the word 'swiftly' in the sentence: The cheetah sprinted swiftly across the grass.",
        answer: "Adverb. 'Swiftly' describes how the cheetah sprinted.",
        example: "Adverbs often tell how, when, or where an action happens."
      },
      {
        category: "English",
        term: "Part of Speech #3",
        question: "Identify the part of speech of the underlined word: <u>They</u> visited the science museum yesterday.",
        speechQuestion: "Identify the part of speech of the word 'They' in the sentence: They visited the science museum yesterday.",
        answer: "Pronoun. 'They' takes the place of the people who visited.",
        example: "Instead of repeating names, we use the pronoun 'they'."
      },
      {
        category: "English",
        term: "Part of Speech #4",
        question: "Identify the part of speech of the underlined word: Heavy <u>rain</u> fell all night long.",
        speechQuestion: "Identify the part of speech of the word 'rain' in the sentence: Heavy rain fell all night long.",
        answer: "Noun. Here, 'rain' is a thing described by the adjective 'heavy'.",
        example: "Tip: Words like 'rain' can be a noun or a verb depending on how they are used!"
      },
      {
        category: "English",
        term: "Part of Speech #5",
        question: "Identify the part of speech of the underlined word: The students <u>solved</u> the tricky math puzzle.",
        speechQuestion: "Identify the part of speech of the word 'solved' in the sentence: The students solved the tricky math puzzle.",
        answer: "Verb. 'Solved' shows the action that the students did.",
        example: "Action verbs tell what the subject is doing."
      },
      {
        category: "English",
        term: "Part of Speech #6",
        question: "Identify the part of speech of the underlined word: Please put your backpack beside <u>her</u>.",
        speechQuestion: "Identify the part of speech of the word 'her' in the sentence: Please put your backpack beside her.",
        answer: "Pronoun. 'Her' replaces a girl's or woman's name.",
        example: "Me, him, her, us, and them are object pronouns."
      },
      {
        category: "English",
        term: "Part of Speech #7",
        question: "Identify the part of speech of the underlined word: The turtle walked <u>slowly</u> toward the pond.",
        speechQuestion: "Identify the part of speech of the word 'slowly' in the sentence: The turtle walked slowly toward the pond.",
        answer: "Adverb. 'Slowly' modifies the verb 'walked'.",
        example: "How did the turtle walk? Slowly."
      },
      {
        category: "English",
        term: "Part of Speech #8",
        question: "Identify the part of speech of the underlined word: Grandma enjoys a <u>daily</u> walk in the park.",
        speechQuestion: "Identify the part of speech of the word 'daily' in the sentence: Grandma enjoys a daily walk in the park.",
        answer: "Adjective. Even though 'daily' ends in '-ly', here it describes the noun 'walk'.",
        example: "What kind of walk? A daily walk."
      },
      {
        category: "English",
        term: "Part of Speech #9",
        question: "Identify the part of speech of the underlined word: Our new neighbor is a very <u>friendly</u> person.",
        speechQuestion: "Identify the part of speech of the word 'friendly' in the sentence: Our new neighbor is a very friendly person.",
        answer: "Adjective. 'Friendly' ends in '-ly', but it describes the noun 'person'.",
        example: "Friendly, lovely, and silly are adjectives, not adverbs!"
      },
      {
        category: "English",
        term: "Part of Speech #10",
        question: "Identify the part of speech of the underlined word: She picked a bouquet of <u>lovely</u> flowers.",
        speechQuestion: "Identify the part of speech of the word 'lovely' in the sentence: She picked a bouquet of lovely flowers.",
        answer: "Adjective. 'Lovely' describes the noun 'flowers'.",
        example: "Not every word ending in '-ly' is an adverb."
      },
      {
        category: "English",
        term: "Part of Speech #11",
        question: "Identify the part of speech of the underlined word: The clown made a <u>silly</u> face to make us laugh.",
        speechQuestion: "Identify the part of speech of the word 'silly' in the sentence: The clown made a silly face to make us laugh.",
        answer: "Adjective. 'Silly' describes the noun 'face'.",
        example: "What kind of face? A silly face."
      },

      // 3. 数学平方与圆、几何核心概念
      {
        category: "Math",
        term: "Square a Number",
        question: "What does it mean to square a number?",
        answer: "To square a number means to multiply that number by itself.",
        example: "To square 4, calculate 4 times 4, which equals 16."
      },
      {
        category: "Math",
        term: "Perfect Square",
        question: "What is a perfect square?",
        answer: "A number that is the product of a whole number multiplied by itself.",
        example: "9, 16, 25, and 36 are perfect squares."
      },
      {
        category: "Math",
        term: "Radius",
        question: "What is the radius of a circle?",
        answer: "A line segment from the center of a circle to any point on its boundary.",
        example: "The radius is always half the length of the diameter."
      },
      {
        category: "Math",
        term: "Diameter",
        question: "What is the diameter of a circle?",
        answer: "A line segment that passes through the center of a circle and connects two points on its boundary.",
        example: "The diameter cuts a circle into two equal halves."
      },
      {
        category: "Math",
        term: "Endpoints",
        question: "What are endpoints?",
        answer: "Points at which a line segment or a ray ends.",
        example: "A line segment has two endpoints, while a ray has one."
      },
      {
        category: "Math",
        term: "Vertex",
        question: "What is a vertex?",
        answer: "The point where two line segments, rays, or sides meet to form an angle.",
        example: "The corner where two sides of a triangle meet is a vertex."
      },
      {
        category: "Math",
        term: "Parallel Lines",
        question: "What are parallel lines?",
        answer: "Lines that go in the same direction and stay the same distance apart without ever crossing.",
        example: "Train tracks are parallel lines."
      },
      {
        category: "Math",
        term: "Intersecting Rays",
        question: "What are intersecting rays?",
        answer: "Two rays that cross or meet at a single common point.",
        example: "Two rays sharing a common endpoint form an angle."
      },
      {
        category: "Math",
        term: "Perpendicular Line Segments",
        question: "What are perpendicular line segments?",
        answer: "Line segments that meet or cross to form square corners, or 90-degree right angles.",
        example: "Adjacent sides of a rectangle are perpendicular line segments."
      },

      // 4. 乘法表、三大性质与估算思维
      {
        category: "Thinking",
        term: "Reasonable Estimate",
        question: "What is a reasonable estimate?",
        answer: "An educated guess close to the exact answer, found by rounding numbers to make math easier.",
        example: "Rounding $48 to $50 gives a reasonable estimate."
      },
      {
        category: "Thinking",
        term: "Multiplication Table",
        question: "What is a multiplication table?",
        answer: "A grid or chart showing the products of pairs of numbers multiplied together.",
        example: "Find 6 times 7 by finding where row 6 and column 7 meet."
      },
      {
        category: "Thinking",
        term: "Properties of Multiplication",
        question: "What are the three core properties of multiplication?",
        answer: "The Commutative Property, the Identity Property, and the Zero Property.",
        example: "Knowing these properties helps simplify mental math."
      },
      {
        category: "Thinking",
        term: "Commutative of Multiplication",
        question: "What is the Commutative Property of multiplication?",
        answer: "Changing the order of the factors does not change the product.",
        example: "3 times 4 equals 4 times 3; both equal 12."
      },
      {
        category: "Thinking",
        term: "Identity Property",
        question: "What is the Identity Property of multiplication?",
        answer: "Multiplying any number by 1 gives a product equal to that same number.",
        example: "9 times 1 equals 9."
      },
      {
        category: "Thinking",
        term: "Zero Property",
        question: "What is the Zero Property of multiplication?",
        answer: "Multiplying any number by 0 always results in a product of 0.",
        example: "25 times 0 equals 0."
      },

      // 5. 英语修辞与比较级/最高级
      {
        category: "English",
        term: "Alliteration",
        question: "What is alliteration?",
        answer: "The repetition of the same beginning consonant sound in words close together.",
        example: "Silly snakes slither silently."
      },
      {
        category: "English",
        term: "Assonance",
        question: "What is assonance?",
        answer: "The repetition of similar vowel sounds inside words that are close together.",
        example: "The rain in Spain stays mainly in the plain."
      },
      {
        category: "English",
        term: "Rhyme",
        question: "What is rhyme?",
        answer: "Words that have the same or similar ending sounds.",
        example: "Star, car, far, and jar."
      },
      {
        category: "English",
        term: "Comparative",
        question: "What is a comparative adjective or adverb?",
        answer: "A word used to compare two things, often ending in '-er' or using the word 'more'.",
        example: "Taller, faster, or more interesting."
      },
      {
        category: "English",
        term: "Superlative",
        question: "What is a superlative adjective or adverb?",
        answer: "A word used to compare three or more things to show the highest degree, often ending in '-est' or using 'most'.",
        example: "Tallest, fastest, or most interesting."
      }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let timerId = null;
    let countdownInterval = null;

    // 渲染当前题目卡片（支持安全渲染下划线标记）
    function renderCard() {
      const item = flashcards[currentIndex];
      const tagEl = document.getElementById('category-tag');
      
      tagEl.innerText = `${item.category} (${currentIndex + 1}/${flashcards.length})`;
      tagEl.className = `tag tag-${item.category.toLowerCase()}`;
      
      document.getElementById('term-text').innerText = item.term;
      document.getElementById('definition-text').innerHTML = item.question;
      
      const exampleEl = document.getElementById('example-text');
      exampleEl.classList.add('hidden');
      document.getElementById('status').innerText = `已准备好第 ${currentIndex + 1} 题。`;
    }

    // 手动秒出答案
    function showAnswer() {
      stopAudioFlow();
      const item = flashcards[currentIndex];
      document.getElementById('definition-text').innerText = item.answer;
      
      const exampleEl = document.getElementById('example-text');
      if (item.example) {
        exampleEl.innerText = `Example: ${item.example}`;
        exampleEl.classList.remove('hidden');
      }
      document.getElementById('status').innerText = "已手动公布答案。";
    }

    // 智能筛选最流畅的自然英文女声
    function speakText(text, callback) {
      if (!('speechSynthesis' in window)) {
        if (callback) callback();
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.88; 

      const voices = window.speechSynthesis.getVoices();
      const femaleVoice = voices.find(v => 
        v.lang.startsWith('en') && (
          v.name.includes('Samantha') || 
          v.name.includes('Victoria') || 
          v.name.includes('Zira') || 
          v.name.includes('Google US English') ||
          v.name.includes('Natural') ||
          v.name.includes('Jenny')
        )
      ) || voices.find(v => v.lang.startsWith('en'));

      if (femaleVoice) utter.voice = femaleVoice;

      let called = false;
      utter.onend = () => { if(!called){ called=true; if(callback) callback(); } };
      utter.onerror = () => { if(!called){ called=true; if(callback) callback(); } };

      window.speechSynthesis.speak(utter);
    }

    // 精确 8 秒倒计时功能
    function startCountdown(sec, callback) {
      let left = sec;
      document.getElementById('status').innerText = `思考中...（还剩 ${left} 秒公布答案）`;
      
      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        left--;
        if (left > 0) {
          document.getElementById('status').innerText = `思考中...（还剩 ${left} 秒公布答案）`;
        } else {
          clearInterval(countdownInterval);
          if (callback) callback();
        }
      }, 1000);
    }

    // 自动音频循环主流程
    function playFlow() {
      if (!isPlaying) return;
      renderCard();
      const item = flashcards[currentIndex];
      document.getElementById('status').innerText = "正在提问...";

      // 若包含专用纯语音播报文本（避免读出 HTML 标签），优先使用 speechQuestion
      const spokenQ = item.speechQuestion ? item.speechQuestion : item.question.replace(/<[^>]*>/g, '');

      speakText(`Question ${currentIndex + 1}. ${spokenQ}`, () => {
        if (!isPlaying) return;

        // 留出严格的 8 秒思考时间
        startCountdown(8, () => {
          if (!isPlaying) return;

          document.getElementById('definition-text').innerText = item.answer;
          const exampleEl = document.getElementById('example-text');
          if (item.example) {
            exampleEl.innerText = `Example: ${item.example}`;
            exampleEl.classList.remove('hidden');
          }
          document.getElementById('status').innerText = "公布正确答案...";

          let ansText = `Answer: ${item.answer}`;
          if (item.example) ansText += ` Example: ${item.example}`;

          speakText(ansText, () => {
            if (!isPlaying) return;
            document.getElementById('status').innerText = "准备进入下一题...";

            timerId = setTimeout(() => {
              if (!isPlaying) return;
              nextCard(true);
            }, 3000);
          });
        });
      });
    }

    function toggleAudioFlow() {
      if (isPlaying) {
        stopAudioFlow();
      } else {
        isPlaying = true;
        document.getElementById('main-btn').innerText = "⏹ 停止语音朗读";
        playFlow();
      }
    }

    function stopAudioFlow() {
      isPlaying = false;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      clearTimeout(timerId);
      clearInterval(countdownInterval);
      document.getElementById('main-btn').innerText = "▶ 开启/停止 语音自动复习 (8秒思考)";
      document.getElementById('status').innerText = "已停止语音。";
    }

    function nextCard(autoPlay = false) {
      stopAudioFlow();
      currentIndex = (currentIndex + 1) % flashcards.length;
      renderCard();
      if (autoPlay) {
        isPlaying = true;
        document.getElementById('main-btn').innerText = "⏹ 停止语音朗读";
        playFlow();
      }
    }

    function prevCard() {
      stopAudioFlow();
      currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
      renderCard();
    }

    window.onload = function() {
      renderCard();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {};
      }
    };
  </script>
</body>
</html>
