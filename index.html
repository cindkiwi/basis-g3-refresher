<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BASIS G3 Master Audio Flashcards</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* 护眼暖白/米灰高雅背景 */
      background-color: #f7f8fa;
      color: #2c3e50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 36px 24px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid #e1e4e8;
      margin-bottom: 20px;
    }
    .tag {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }
    /* 莫兰迪低饱和度护眼配色 */
    .tag-math { background-color: #e3f2fd; color: #1565c0; }
    .tag-english { background-color: #fff3e0; color: #e65100; }
    .tag-thinking { background-color: #f3e5f5; color: #7b1fa2; }
    
    /* 极致超大字号术语标题 */
    .term {
      font-size: 3.1rem;
      font-weight: 900;
      color: #1a202c;
      margin-bottom: 16px;
      word-break: break-word;
      line-height: 1.15;
    }
    .definition {
      font-size: 1.35rem;
      color: #4a5568;
      line-height: 1.6;
      margin-bottom: 20px;
      min-height: 4rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .example {
      font-size: 1.05rem;
      font-style: italic;
      color: #276749;
      background: #f0fff4;
      padding: 14px;
      border-radius: 14px;
      border-left: 4px solid #38a169;
      margin-bottom: 10px;
      text-align: left;
    }
    .btn {
      background-color: #6b46c1;
      color: #fff;
      border: none;
      padding: 18px 32px;
      font-size: 1.25rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(107, 70, 193, 0.3);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background-color: #edf2f7;
      color: #2d3748;
      box-shadow: none;
      border: 1px solid #cbd5e0;
    }
    .btn-manual {
      background-color: #319795;
      color: #fff;
      box-shadow: 0 4px 14px rgba(49, 151, 149, 0.3);
    }
    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 520px;
    }
    .status-text {
      margin-top: 16px;
      font-size: 1rem;
      color: #718096;
      font-weight: 600;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div id="category-tag" class="tag tag-math">Math Term</div>
    <div id="term-text" class="term">Loading...</div>
    <div id="definition-text" class="definition">准备就绪</div>
    <div id="example-text" class="example hidden"></div>
  </div>

  <div style="width:100%; max-width:520px;">
    <button id="show-answer-btn" class="btn btn-manual" onclick="showAnswer()">💡 显示答案 (秒出结果)</button>
    <button id="main-btn" class="btn" onclick="toggleAudioFlow()">▶ 开启/停止 语音自动复习 (8秒思考)</button>
    <div class="controls" style="margin-top: 12px;">
      <button class="btn btn-secondary" onclick="prevCard()">上一题</button>
      <button class="btn btn-secondary" onclick="nextCard()">下一题</button>
    </div>
  </div>

  <div id="status" class="status-text">就绪：点击“开启语音自动复习”或点击“上一题/下一题”翻页。</div>

  <script>
    // 最新定制 BASIS G3 车上复习词库与题库
    const flashcards = [
      // 1. 平方直接心算与平方根
      {
        category: "Math",
        term: "3 squared = ?",
        question: "What does 3 squared equal?",
        answer: "3 squared equals 9. Because 3 times 3 equals 9.",
        example: "Squaring a number means multiplying it by itself."
      },
      {
        category: "Math",
        term: "5 squared = ?",
        question: "What does 5 squared equal?",
        answer: "5 squared equals 25. Because 5 times 5 equals 25.",
        example: "5 squared is written as 5 with a small 2 at the top right."
      },
      {
        category: "Math",
        term: "7 squared = ?",
        question: "What does 7 squared equal?",
        answer: "7 squared equals 49. Because 7 times 7 equals 49.",
        example: "49 is a perfect square."
      },
      {
        category: "Math",
        term: "Square Root",
        question: "What is a square root, and what is the square root of 36?",
        answer: "A square root is a number that multiplies by itself to make the original number. The square root of 36 is 6.",
        example: "Because 6 times 6 equals 36, the square root of 36 is 6."
      },

      // 2. 几何概念与作图方法
      {
        category: "Math",
        term: "Vertex",
        question: "What is a vertex?",
        answer: "The point where two line segments, rays, or sides meet to form an angle.",
        example: "The corner where two sides of a triangle meet is a vertex."
      },
      {
        category: "Math",
        term: "How to Draw Parallel Lines",
        question: "How do you draw parallel lines?",
        answer: "Draw two straight lines going in the exact same direction that stay the same distance apart so they never cross.",
        example: "Like drawing the two rails of a train track."
      },
      {
        category: "Math",
        term: "How to Draw Intersecting Rays",
        question: "How do you draw intersecting rays?",
        answer: "Draw two rays that each start at an endpoint, go forever in one direction, and cross or meet at one common point.",
        example: "Each ray must have one dot at the start and one arrow at the other end."
      },
      {
        category: "Math",
        term: "How to Draw Perpendicular Line Segments",
        question: "How do you draw perpendicular line segments?",
        answer: "Draw two line segments with endpoints at both ends that meet or cross to form a square corner, or a 90-degree right angle.",
        example: "Like drawing the letter L or a plus sign with endpoints."
      },

      // 3. 估算思维与乘法三大性质
      {
        category: "Thinking",
        term: "Reasonable Estimate",
        question: "What is a reasonable estimate?",
        answer: "An educated guess close to the exact answer, found by rounding numbers to make math easier.",
        example: "Rounding $48 to $50 gives a reasonable estimate."
      },
      {
        category: "Thinking",
        term: "Properties of Multiplication",
        question: "What are the three core properties of multiplication?",
        answer: "The Commutative Property, the Identity Property, and the Zero Property.",
        example: "Knowing these properties helps simplify mental math."
      },
      {
        category: "Thinking",
        term: "Commutative of Multiplication",
        question: "What is the Commutative Property of multiplication?",
        answer: "Changing the order of the factors does not change the product.",
        example: "3 times 4 equals 4 times 3; both equal 12."
      },
      {
        category: "Thinking",
        term: "Identity Property",
        question: "What is the Identity Property of multiplication?",
        answer: "Multiplying any number by 1 gives a product equal to that same number.",
        example: "9 times 1 equals 9."
      },
      {
        category: "Thinking",
        term: "Zero Property",
        question: "What is the Zero Property of multiplication?",
        answer: "Multiplying any number by 0 always results in a product of 0.",
        example: "25 times 0 equals 0."
      },

      // 4. 英语修辞与语法比较级
      {
        category: "English",
        term: "Alliteration",
        question: "What is alliteration?",
        answer: "The repetition of the same beginning consonant sound in words close together.",
        example: "Silly snakes slither silently."
      },
      {
        category: "English",
        term: "Assonance",
        question: "What is assonance?",
        answer: "The repetition of similar vowel sounds inside words that are close together.",
        example: "The rain in Spain stays mainly in the plain."
      },
      {
        category: "English",
        term: "Rhyme",
        question: "What is rhyme?",
        answer: "Words that have the same or similar ending sounds.",
        example: "Star, car, far, and jar."
      },
      {
        category: "English",
        term: "Comparative",
        question: "What is a comparative adjective or adverb?",
        answer: "A word used to compare two things, often ending in '-er' or using the word 'more'.",
        example: "Taller, faster, or more interesting."
      },
      {
        category: "English",
        term: "Superlative",
        question: "What is a superlative adjective or adverb?",
        answer: "A word used to compare three or more things to show the highest degree, often ending in '-est' or using 'most'.",
        example: "Tallest, fastest, or most interesting."
      }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let timerId = null;
    let countdownInterval = null;

    function renderCard() {
      const item = flashcards[currentIndex];
      const tagEl = document.getElementById('category-tag');
      
      tagEl.innerText = `${item.category} (${currentIndex + 1}/${flashcards.length})`;
      tagEl.className = `tag tag-${item.category.toLowerCase()}`;
      
      document.getElementById('term-text').innerText = item.term;
      document.getElementById('definition-text').innerText = item.question;
      
      const exampleEl = document.getElementById('example-text');
      exampleEl.classList.add('hidden');
      document.getElementById('status').innerText = `已准备好第 ${currentIndex + 1} 题。`;
    }

    function showAnswer() {
      stopAudioFlow();
      const item = flashcards[currentIndex];
      document.getElementById('definition-text').innerText = item.answer;
      
      const exampleEl = document.getElementById('example-text');
      if (item.example) {
        exampleEl.innerText = `Example: ${item.example}`;
        exampleEl.classList.remove('hidden');
      }
      document.getElementById('status').innerText = "已手动公布答案。";
    }

    // 智能筛选最流畅的女声 (Female Voice)
    function speakText(text, callback) {
      if (!('speechSynthesis' in window)) {
        if (callback) callback();
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.88; 

      const voices = window.speechSynthesis.getVoices();
      const femaleVoice = voices.find(v => 
        v.lang.startsWith('en') && (
          v.name.includes('Samantha') || 
          v.name.includes('Victoria') || 
          v.name.includes('Zira') || 
          v.name.includes('Google US English') ||
          v.name.includes('Natural') ||
          v.name.includes('Jenny')
        )
      ) || voices.find(v => v.lang.startsWith('en'));

      if (femaleVoice) utter.voice = femaleVoice;

      let called = false;
      utter.onend = () => { if(!called){ called=true; if(callback) callback(); } };
      utter.onerror = () => { if(!called){ called=true; if(callback) callback(); } };

      window.speechSynthesis.speak(utter);
    }

    // 8 秒倒计时功能
    function startCountdown(sec, callback) {
      let left = sec;
      document.getElementById('status').innerText = `思考中...（还剩 ${left} 秒公布答案）`;
      
      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        left--;
        if (left > 0) {
          document.getElementById('status').innerText = `思考中...（还剩 ${left} 秒公布答案）`;
        } else {
          clearInterval(countdownInterval);
          if (callback) callback();
        }
      }, 1000);
    }

    function playFlow() {
      if (!isPlaying) return;
      renderCard();
      const item = flashcards[currentIndex];
      document.getElementById('status').innerText = "正在提问...";

      speakText(`Question ${currentIndex + 1}. ${item.question}`, () => {
        if (!isPlaying) return;

        // 留出严格的 8 秒思考时间
        startCountdown(8, () => {
          if (!isPlaying) return;

          document.getElementById('definition-text').innerText = item.answer;
          document.getElementById('example-text').classList.remove('hidden');
          document.getElementById('status').innerText = "公布正确答案...";

          let ansText = `Answer: ${item.answer}`;
          if (item.example) ansText += ` Example: ${item.example}`;

          speakText(ansText, () => {
            if (!isPlaying) return;
            document.getElementById('status').innerText = "准备进入下一题...";

            timerId = setTimeout(() => {
              if (!isPlaying) return;
              nextCard(true);
            }, 3000);
          });
        });
      });
    }

    function toggleAudioFlow() {
      if (isPlaying) {
        stopAudioFlow();
      } else {
        isPlaying = true;
        document.getElementById('main-btn').innerText = "⏹ 停止语音朗读";
        playFlow();
      }
    }

    function stopAudioFlow() {
      isPlaying = false;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      clearTimeout(timerId);
      clearInterval(countdownInterval);
      document.getElementById('main-btn').innerText = "▶ 开启/停止 语音自动复习 (8秒思考)";
      document.getElementById('status').innerText = "已停止语音。";
    }

    function nextCard(autoPlay = false) {
      stopAudioFlow();
      currentIndex = (currentIndex + 1) % flashcards.length;
      renderCard();
      if (autoPlay) {
        isPlaying = true;
        document.getElementById('main-btn').innerText = "⏹ 停止语音朗读";
        playFlow();
      }
    }

    function prevCard() {
      stopAudioFlow();
      currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
      renderCard();
    }

    window.onload = function() {
      renderCard();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {};
      }
    };
  </script>
</body>
</html>
